        function setupDayFilterMenu() {
            const days = ['all', ...new Set(itinerary.map(event => event.day))].sort();
            dayFilterMenu.innerHTML = '';
            days.forEach(day => {
                const btn = document.createElement('button');
                btn.dataset.day = day;
                btn.className = 'filter-btn px-3 py-2 border-2 border-black font-semibold text-xs sm:text-sm transition-colors duration-200 bg-white hover:bg-black hover:text-white';
                btn.textContent = day === 'all' ? 'Prossime Attività' : new Date(`${day}T00:00:00`).toLocaleDateString('it-IT', { day: 'numeric', month: 'long' });
                if (day === currentFilter) btn.classList.add('active');
                btn.addEventListener('click', () => {
                    currentFilter = day;
                    updateActivitiesList();
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                });
                dayFilterMenu.appendChild(btn);
            });
        }
        
        function updateNowAndNext() {
            const now = new Date();
            const sortedEvents = itinerary.map(e => {
                const startDate = new Date(`${e.day}T${e.startTime}`);
                let endDate = new Date(`${e.day}T${e.endTime}`);
                if (e.endTime < e.startTime) { endDate.setDate(endDate.getDate() + 1); }
                return {...e, startDate, endDate };
            }).sort((a, b) => a.startDate - b.startDate);

            const currentActivity = sortedEvents.find(e => now >= e.startDate && now <= e.endDate);
            const nextActivity = sortedEvents.find(e => e.startDate > now);

            if (currentActivity) {
                currentActivityContent.innerHTML = `<p class="font-bold text-lg sm:text-xl">${currentActivity.title}</p><p class="text-sm text-blue-200">Fino alle ${currentActivity.endTime}</p>`;
            } else {
                currentActivityContent.innerHTML = `<p class="text-blue-100">Nessuna attività in corso. Goditi il relax!</p>`;
            }

            if (nextActivity) {
                 const appleMapsUrl = `https://maps.apple.com/?daddr=${nextActivity.coordinates}&q=${encodeURIComponent(nextActivity.location)}`;
                nextActivityContent.innerHTML = `
                <div class="flex justify-between items-start gap-3">

                        <p class="font-bold text-lg sm:text-xl text-gray-800">${nextActivity.title}</p>
                        <p class="text-sm text-gray-500">Alle ${nextActivity.startTime} del ${nextActivity.startDate.toLocaleDateString('it-IT', {day: 'numeric', month: 'short'})}</p>
                    </div>
                    <a href="${appleMapsUrl}" target="_blank" rel="noopener noreferrer" class="flex-shrink-0 bg-black hover:bg-gray-700 text-white font-bold py-2 px-4 transition-colors duration-300 text-center flex items-center justify-center gap-2">
                        <span>Vai</span>
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 10a.75.75 0 01.75-.75h10.638L10.23 5.29a.75.75 0 111.04-1.08l5.5 5.25a.75.75 0 010 1.08l-5.5 5.25a.75.75 0 11-1.04-1.08l4.158-3.96H3.75A.75.75 0 013 10z" clip-rule="evenodd" /></svg>
                    </a>
                </div>
                `;
            } else {
                nextActivityContent.innerHTML = `<p class="text-gray-500">Viaggio concluso!</p>`;
            }
        }

        async function fetchAndUpdateTravelInfo(eventIndex, newLocation, button) {
            const previousEvent = itinerary[eventIndex - 1];
            if (!previousEvent) {
                alert("Impossibile calcolare il percorso per la prima attività.");
                return;
            }

            button.innerHTML = '<div class="loader"></div>';

            const prompt = `Un utente sta pianificando un viaggio a Ibiza. La tappa precedente è "${previousEvent.location}". La nuova destinazione è "${newLocation}, Ibiza". Fornisci le seguenti informazioni in un oggetto JSON: 1. "coordinates": le coordinate geografiche (lat,lon). 2. "travelTime": il tempo di percorrenza stimato in scooter. 3. "travelMethod": il mezzo di trasporto consigliato (es. "Scooter"). Il formato JSON deve essere: {"coordinates": "stringa", "travelTime": "stringa", "travelMethod": "stringa"}`;
            
            try {
                let chatHistory = [{ role: "user", parts: [{ text: prompt }] }];
                const payload = { 
                    contents: chatHistory,
                    generationConfig: {
                        responseMimeType: "application/json",
                        responseSchema: {
                            type: "OBJECT",
                            properties: {
                                "coordinates": { "type": "STRING" },
                                "travelTime": { "type": "STRING" },
                                "travelMethod": { "type": "STRING" }
                            }
                        }
                    }
                };
                const apiKey = ""; 
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`;
                
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();
                 if (result.candidates && result.candidates[0].content && result.candidates[0].content.parts[0]) {
                    const travelData = JSON.parse(result.candidates[0].content.parts[0].text);
                    itinerary[eventIndex].coordinates = travelData.coordinates;
                    itinerary[eventIndex].travelTime = travelData.travelTime;
                    itinerary[eventIndex].travelMethod = travelData.travelMethod;
                    updateActivitiesList();
                } else {
                    throw new Error("Risposta AI non valida.");
                }
            } catch (error) {
                console.error("Errore durante il recupero delle info di viaggio:", error);
                alert("Impossibile aggiornare le informazioni di viaggio. Riprova.");
                button.innerHTML = 'Aggiorna Info';
            }
        }

                    const startTimeInput = card.querySelector(`[data-prop='startTime']`);
                    const endTimeInput = card.querySelector(`[data-prop='endTime']`);
                    
                    if(titleInput) itinerary[index].title = titleInput.value;
                    if(locationInput) itinerary[index].location = locationInput.value;
                    if(descriptionInput) itinerary[index].description = descriptionInput.value;
                    if(startTimeInput) itinerary[index].startTime = startTimeInput.value;
                    if(endTimeInput) itinerary[index].endTime = endTimeInput.value;
                }
            });
        }

        function updateActivitiesList() {
            const now = new Date();
            let eventsToShow;

            if (currentFilter === 'all') {
                timelineTitle.textContent = "Prossime Attività";
                eventsToShow = itinerary.map((e, i) => ({ ...e, originalIndex: i, startDate: new Date(`${e.day}T${e.startTime}`) })).filter(e => e.startDate > now).sort((a, b) => a.startDate - b.startDate);
            } else {
                const dayString = new Date(`${currentFilter}T00:00:00`).toLocaleDateString('it-IT', {day: 'numeric', month: 'long'});
                timelineTitle.textContent = `Programma del ${dayString}`;
                eventsToShow = itinerary.map((e, i) => ({ ...e, originalIndex: i, startDate: new Date(`${e.day}T${e.startTime}`) })).filter(e => e.day === currentFilter).sort((a, b) => a.startDate - b.startDate);
            }

            upcomingActivitiesContainer.innerHTML = '';

            if (eventsToShow.length > 0) {
                noActivitiesMessage.classList.add('hidden');
                eventsToShow.forEach((event, index) => {
                    const isPast = event.startDate < now && currentFilter !== 'all';
                    const previousEvent = eventsToShow[index - 1];
                    if (index > 0 && event.day === previousEvent.day && event.travelTime) {
                        const travelInfoHTML = `<div class="flex items-center justify-center gap-3 my-4 ${isPast ? 'past-activity' : ''}"><div class="w-8 h-px bg-gray-300"></div><div class="flex items-center gap-2 text-xs sm:text-sm text-gray-600 font-bold">${getTravelIcon(event.travelMethod)}<span>${event.travelMethod} &bull; ${event.travelTime}</span></div><div class="w-8 h-px bg-gray-300"></div></div>`;
                        upcomingActivitiesContainer.innerHTML += travelInfoHTML;
                    }

                    const appleMapsUrl = `https://maps.apple.com/?daddr=${event.coordinates}&q=${encodeURIComponent(event.location)}`;
                    
                    let activityHTML;

                    if (isEditing) {
                        activityHTML = `
                        <div class="activity-card bg-white p-4 sm:p-5 border-2 border-black" data-index="${event.originalIndex}">
                            <div class="flex-grow mb-3 sm:mb-0">
                                <span class="text-xs sm:text-sm font-bold text-blue-700">${new Date(event.startDate).toLocaleDateString('it-IT', { weekday: 'short', day: 'numeric' })}</span>
                                <input type="text" value="${event.title}" class="edit-input font-bold mt-1" data-prop="title">
                                <div class="flex items-center gap-2 mt-2">
                                    <input type="text" value="${event.location}" class="edit-input" data-prop="location" placeholder="Nuovo luogo">
                                    <button class="update-info-btn p-1 bg-blue-500 text-white" data-index="${event.originalIndex}">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path d="M11.983 1.904a.75.75 0 00-1.292-.868l-6.5 9.5a.75.75 0 001.044 1.243l2.52-1.727L6 14.25a.75.75 0 001.244.82l6.5-9.5a.75.75 0 00-1.044-1.243l-2.52 1.727L12 5.75a.75.75 0 00-1.244-.82z" /></svg>
                                    </button>
                                </div>
                            </div>
                            <div class="mt-3 pt-3 border-t border-gray-200">
                                <textarea class="edit-input" data-prop="description" rows="3">${event.description}</textarea>
                                <div class="flex gap-4 mt-2">
                                    <input type="time" value="${event.startTime}" class="edit-input" data-prop="startTime">
                                    <input type="time" value="${event.endTime}" class="edit-input" data-prop="endTime">
                                </div>
                            </div>
                        </div>`;
                    } else {
                        activityHTML = `
                        <div class="activity-card bg-white p-4 sm:p-5 border-2 border-black transition-all duration-300 ${isPast ? 'past-activity' : ''}">
                            <div class="flex flex-col sm:flex-row justify-between sm:items-start">
                                <div class="flex-grow mb-3 sm:mb-0">
                                    <span class="text-xs sm:text-sm font-bold text-blue-700">${new Date(event.startDate).toLocaleDateString('it-IT', { weekday: 'short', day: 'numeric' })} alle ${event.startTime}</span>
                                    <h3 class="text-lg sm:text-xl font-bold mt-1 text-gray-900 flex items-center gap-2">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 flex-shrink-0" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9.69 18.23a2.25 2.25 0 003.62 0l6.25-10.5c.8-1.333.13-3.23-1.54-3.23H2.38c-1.67 0-2.34 1.9-1.54 3.23l6.25 10.5zM10 12a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd" /></svg>
                                        ${event.title}
                                    </h3>
                                </div>
                                <a href="${appleMapsUrl}" target="_blank" rel="noopener noreferrer" class="w-full sm:w-auto flex-shrink-0 bg-black hover:bg-gray-700 text-white font-bold py-2 px-4 transition-colors duration-300 text-center flex items-center justify-center gap-2">
                                    <span>Vai</span>
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 10a.75.75 0 01.75-.75h10.638L10.23 5.29a.75.75 0 111.04-1.08l5.5 5.25a.75.75 0 010 1.08l-5.5 5.25a.75.75 0 11-1.04-1.08l4.158-3.96H3.75A.75.75 0 013 10z" clip-rule="evenodd" /></svg>
                                </a>
                            </div>
                            <div class="mt-3 pt-3 border-t border-gray-200">
                                <p class="text-sm text-gray-700">${event.description}</p>
                            </div>
                        </div>`;
                    }
                    upcomingActivitiesContainer.innerHTML += activityHTML;
                });
                // Add event listeners for the new update buttons
                document.querySelectorAll('.update-info-btn').forEach(button => {
                    button.addEventListener('click', (e) => {
                        const index = parseInt(e.currentTarget.dataset.index, 10);
                        const card = e.currentTarget.closest('.activity-card');
                        const locationInput = card.querySelector("[data-prop='location']");
                        fetchAndUpdateTravelInfo(index, locationInput.value, e.currentTarget);
                    });
                });
            } else {
                noActivitiesMessage.classList.remove('hidden');
            }
        }

        editToggleButton.addEventListener('click', () => {
            if (isEditing) {
                saveChanges();
                editToggleButton.textContent = 'Modifica';
                editToggleButton.classList.remove('bg-black', 'text-white');
                editToggleButton.classList.add('bg-white', 'text-black');
            } else {
                editToggleButton.textContent = 'Salva';
                editToggleButton.classList.remove('bg-white', 'text-black');
                editToggleButton.classList.add('bg-black', 'text-white');
            }
            isEditing = !isEditing;
            updateActivitiesList();
            updateNowAndNext();
        });

        function initializeMap() {
             if (map) {
                map.remove();
                map = null;
            }
            map = L.map(mapContainer).setView([38.9833, 1.4329], 10);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);

            const markers = [];
            itinerary.forEach(event => {
                const [latitude, longitude] = event.coordinates.split(',').map(Number);
                if (!isNaN(latitude) && !isNaN(longitude)) {
                    const marker = L.marker([latitude, longitude]).addTo(map)
                        .bindPopup(`<b>${event.title}</b><br>${event.location}`);
                    markers.push(marker);
                }
            });
            
            if (markers.length > 0) {
                const group = new L.featureGroup(markers);
                map.fitBounds(group.getBounds().pad(0.2));
            }
        }

        showMapButton.addEventListener('click', () => {
            mapOverlay.classList.remove('hidden');
            mapOverlay.classList.add('flex');
            // A small delay to ensure the container is visible before initializing the map
            setTimeout(() => {
                initializeMap();
            }, 10);
        });

        closeMapButton.addEventListener('click', () => {
            mapOverlay.classList.add('hidden');
            mapOverlay.classList.remove('flex');
        });

        addActivityBtn.addEventListener('click', () => {
            addActivityModal.classList.remove('hidden');
            addActivityModal.classList.add('flex');
        });

        closeAddModalBtn.addEventListener('click', () => {
            addActivityModal.classList.add('hidden');
            addActivityModal.classList.remove('flex');
        });

        addActivityForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const newEventData = Object.fromEntries(formData.entries());

            const tempEvent = { ...newEventData, startDate: new Date(`${newEventData.day}T${newEventData.startTime}`) };
            const tempItinerary = [...itinerary.map(ev => ({...ev, startDate: new Date(`${ev.day}T${ev.startTime}`)})), tempEvent];
            tempItinerary.sort((a, b) => a.startDate - b.startDate);
            
            const newEventIndexInSorted = tempItinerary.findIndex(ev => ev === tempEvent);
            const previousEvent = newEventIndexInSorted > 0 ? tempItinerary[newEventIndexInSorted - 1] : itinerary[0]; // fallback to first event if no predecessor

            // Fetch travel info for the new event
            const button = e.target.querySelector('button[type="submit"]');
            button.disabled = true;
            button.innerHTML = '<div class="loader mx-auto"></div>';

            const prompt = `Un utente sta pianificando un viaggio a Ibiza. La tappa precedente è "${previousEvent.location}". La nuova destinazione è "${newEventData.location}, Ibiza". Fornisci le seguenti informazioni in un oggetto JSON: 1. "coordinates": le coordinate geografiche (lat,lon). 2. "travelTime": il tempo di percorrenza stimato in scooter. 3. "travelMethod": il mezzo di trasporto consigliato (es. "Scooter"). Il formato JSON deve essere: {"coordinates": "stringa", "travelTime": "stringa", "travelMethod": "stringa"}`;
            
            try {
                let chatHistory = [{ role: "user", parts: [{ text: prompt }] }];
                const payload = { 
                    contents: chatHistory,
                    generationConfig: {
                        responseMimeType: "application/json",
                        responseSchema: {
                            type: "OBJECT",
                            properties: {
                                "coordinates": { "type": "STRING" },
                                "travelTime": { "type": "STRING" },
                                "travelMethod": { "type": "STRING" }
                            }
                        }
                    }
                };
                const apiKey = ""; 
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`;
                
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();
                if (result.candidates && result.candidates[0].content && result.candidates[0].content.parts[0]) {
                    const travelData = JSON.parse(result.candidates[0].content.parts[0].text);
                    const finalNewEvent = { ...newEventData, ...travelData };
                    itinerary.push(finalNewEvent);
                    itinerary.sort((a, b) => new Date(`${a.day}T${a.startTime}`) - new Date(`${b.day}T${b.startTime}`));
                    
                    addActivityForm.reset();
                    addActivityModal.classList.add('hidden');
                    addActivityModal.classList.remove('flex');

                    setupDayFilterMenu();
                    updateActivitiesList();
                    updateNowAndNext();
                } else {
                    throw new Error("Risposta AI non valida.");
                }
            } catch (error) {
                console.error("Errore durante la creazione dell'attività:", error);
                alert("Impossibile creare la nuova attività. Riprova.");
            } finally {
                button.disabled = false;
                button.innerHTML = 'Salva Attività';
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            setupDayFilterMenu();
            updateClock();
            updateNowAndNext();
            updateActivitiesList();
            setInterval(updateClock, 1000); 
            setInterval(updateNowAndNext, 5000);
            setInterval(() => {
                if (!isEditing) {
                   updateActivitiesList();
                }
            }, 60000); 
        });
    </script>
</body>
</html>
