<!DOCTYPE html>
<html lang="en">

<head>
  <title>Project Video — zinco.cc</title>
  <meta name="description" content="Watch the project video." />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="canonical" href="https://zinco.cc/video-viewer.html" />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="imghome/logo_zinco.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://use.typekit.net/rra4uka.css">

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    @font-face {
      font-family: 'NeuzeitHeavy';
      src: url('fonts/Neuzeit_font/Neuzeit S LT W01 Book Heavy.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }

    :root {
      --white: #ffffff;
      --black: #0a0a0a;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: var(--black);
      color: var(--white);
      font-family: 'aktiv-grotesk', 'Helvetica Neue', Arial, sans-serif;
      font-weight: 600;
      overflow: hidden;
    }

    /* ── Full-screen video bg ── */
    #video-bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      opacity: 0;
      transition: opacity 1.2s ease;
    }

    #video-bg.ready {
      opacity: 1;
    }

    /* ── Full-screen image bg (for projects without video) ── */
    #image-bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      opacity: 0;
      transition: opacity 1.2s ease;
      display: none;
    }

    #image-bg.ready {
      opacity: 1;
    }

    /* ── Gradient overlay ── */
    .overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(to bottom,
          rgba(0, 0, 0, 0.55) 0%,
          rgba(0, 0, 0, 0.05) 40%,
          rgba(0, 0, 0, 0.05) 60%,
          rgba(0, 0, 0, 0.75) 100%);
      z-index: 1;
    }

    /* ── UI Layer ── */
    .ui {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(1.5rem, 5vw, 2.5rem);
      pointer-events: none;
    }

    /* Top: logo + label */
    .ui-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
    }

    .logo-link {
      pointer-events: all;
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      opacity: 0;
      transform: translateY(-12px);
      transition: opacity 0.7s ease 0.4s, transform 0.7s ease 0.4s;
    }

    .logo-link.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .logo-link img {
      height: 32px;
      width: auto;
      filter: invert(1);
    }

    .project-label {
      font-size: clamp(0.65rem, 2vw, 0.8rem);
      font-weight: 400;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.55);
      opacity: 0;
      transform: translateY(-12px);
      transition: opacity 0.7s ease 0.6s, transform 0.7s ease 0.6s;
      text-align: right;
    }

    .project-label.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Center: big title */
    .ui-center {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      padding: 0 clamp(1.5rem, 5vw, 2.5rem);
    }

    #project-title {
      font-size: clamp(3rem, 14vw, 9rem);
      font-weight: 200;
      letter-spacing: -0.04em;
      line-height: 0.95;
      color: var(--white);
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.9s ease 0.2s, transform 0.9s ease 0.2s;
      text-shadow: 0 2px 40px rgba(0, 0, 0, 0.4);
    }

    #project-title.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Bottom: buttons + mute */
    .ui-bottom {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .cta-group {
      display: flex;
      flex-direction: row;
      gap: 0.75rem;
      flex-wrap: wrap;
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.8s ease 0.8s, transform 0.8s ease 0.8s;
    }

    .cta-group.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Buttons — Neuzeit Heavy */
    .btn-cta {
      pointer-events: all;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      border: 2px solid #000000;
      background: #ffffff;
      color: #000000;
      padding: 0.75rem 1.75rem;
      height: 48px;
      font-family: 'NeuzeitHeavy', 'Helvetica Neue', Arial, sans-serif;
      font-weight: normal;
      font-size: clamp(0.8rem, 2.5vw, 0.95rem);
      letter-spacing: 0.06em;
      text-transform: lowercase;
      text-decoration: none;
      cursor: pointer;
      transition: opacity 0.25s, transform 0.2s;
    }

    .btn-cta:hover {
      transform: translateX(4px);
      opacity: 0.85;
    }

    .btn-cta .arrow {
      font-size: 1.1em;
    }

    /* Mute button — solid black square */
    .btn-mute {
      pointer-events: all;
      background: #000000;
      border: none;
      color: var(--white);
      width: 44px;
      height: 44px;
      border-radius: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
      flex-shrink: 0;
      opacity: 0;
      transition: opacity 0.8s ease 1s, background 0.2s;
    }

    .btn-mute.visible {
      opacity: 1;
    }

    .btn-mute:hover {
      background: #222222;
    }

    /* Error state */
    #error-state {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--black);
      z-index: 10;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      text-align: center;
      padding: 2rem;
    }

    #error-state h1 {
      font-size: clamp(2rem, 8vw, 4rem);
      font-weight: 200;
      letter-spacing: -0.03em;
    }

    #error-state p {
      color: rgba(255, 255, 255, 0.5);
      font-size: 1rem;
    }

    #error-state a {
      color: var(--white);
      text-decoration: underline;
    }

    /* Loading spinner */
    #loader {
      position: fixed;
      inset: 0;
      background: var(--black);
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.6s ease;
    }

    #loader.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-top-color: var(--white);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <!-- Loader -->
  <div id="loader">
    <div class="spinner"></div>
  </div>

  <!-- Error state -->
  <div id="error-state">
    <img src="imghome/logo_zinco.svg" style="height:36px; filter:invert(1); margin-bottom:1rem;" alt="zinco.cc">
    <h1>Project not found</h1>
    <p>The video you're looking for doesn't exist or has been moved.</p>
    <a href="index.html">← Back to portfolio</a>
  </div>

  <!-- Video background -->
  <video id="video-bg" autoplay muted playsinline loop preload="auto"></video>

  <!-- Image background (for projects without video) -->
  <img id="image-bg" alt="project background">

  <!-- Dark overlay -->
  <div class="overlay"></div>

  <!-- UI -->
  <div class="ui">
    <div class="ui-top">
      <a href="index.html" class="logo-link" id="logo-link">
        <img src="imghome/logo_zinco.svg" alt="zinco.cc">
      </a>
      <div class="project-label" id="project-label">project tab</div>
    </div>

    <div class="ui-center">
      <h1 id="project-title"></h1>
    </div>

    <div class="ui-bottom">
      <div class="cta-group" id="cta-group">
        <a href="#" id="discover-link" class="btn-cta">
          <span>discover the project</span>
          <span class="arrow">→</span>
        </a>
        <a href="#" id="watch-link" class="btn-cta" target="_blank">
          <span>watch video</span>
          <span class="arrow">→</span>
        </a>
        <!-- site buttons injected dynamically by JS -->
      </div>
      <button class="btn-mute" id="btn-mute" title="Toggle sound" aria-label="Toggle mute">🔇</button>
    </div>
  </div>

  <script>
    const projectsDB = {
      alua: {
        title: "ALUA",
        video: "imghome/alua_video.webm",
        link: "https://zjncoo.github.io/ALUA.IT/",
        external: true
      },
      "rifiuti_spaziali": {
        title: "Rifiuti Spaziali",
        video: "imghome/rifiuti_spaziali_test.webm",
        link: "https://zjncoo.github.io/RifiutiSpaziali/index.html",
        external: true
      },
      roxy: {
        title: "ROXY",
        video: "ROXY/img/video finito.mp4",
        link: "ROXY/roxy.html",
        external: false
      },
      nus: {
        title: "NUS",
        video: "NUS/img/nus_brand_video.webm",
        link: "NUS/nus.html",
        external: false
      },
      piedibus: {
        title: "Piedibus Mozzate",
        video: "piedibus_mozzate/piedibus_mozzate_video_compressed.mp4",
        link: "piedibus_mozzate/piedibus_mozzate.html",
        external: false
      },
      am_group: {
        title: "AM Group (AM Decor + 3M)",
        // Nessun video — usa immagine di sfondo
        image: "3M_Soluzioni_Immobiliari/img/3M_window.webp",
        sites: [
          { label: "discover AM Decor", url: "amdecor/amdecor.html", external: false },
          { label: "discover 3M", url: "3M_Soluzioni_Immobiliari/3M_soluzioni_immobiliari.html", external: false },
          { label: "visit AM Decor", url: "https://www.amdecor.it", external: true },
          { label: "visit 3M", url: "https://www.3m.com", external: true }
        ]
      },
      zoom: {
        title: "ZOOM",
        video: "publications/zoom/img/animazione fumetto.mp4",
        link: "publications/zoom/zoom.html",
        external: false
      },
      "zoom-anim1": {
        title: "ZOOM — animazione 1",
        video: "UNI YEAR 1/projects_basics_lab/img/animations/ANIMAZIONE1 - GRUPPO3.mp4",
        link: "publications/zoom/zoom.html",
        external: false
      },
      "zoom-anim3": {
        title: "ZOOM — animazione 3",
        video: "UNI YEAR 1/projects_basics_lab/img/animations/ANIMAZIONE3-GRUPPO3.mp4",
        link: "publications/zoom/zoom.html",
        external: false
      },
      "zoom-anim4": {
        title: "ZOOM — animazione 4",
        video: "UNI YEAR 1/projects_basics_lab/img/animations/ANIMAZIONE4-GRUPPO3.mp4",
        link: "publications/zoom/zoom.html",
        external: false
      },
      "zoom-fumetto": {
        title: "ZOOM — fumetto",
        video: "UNI YEAR 1/projects_basics_lab/img/animations/animazione fumetto.mp4",
        link: "publications/zoom/zoom.html",
        external: false
      }
    };

    const params = new URLSearchParams(window.location.search);
    const slug = (params.get('project') || '').toLowerCase().trim();
    const project = projectsDB[slug];

    const loader = document.getElementById('loader');
    const errorState = document.getElementById('error-state');
    const video = document.getElementById('video-bg');
    const imageBg = document.getElementById('image-bg');
    const titleEl = document.getElementById('project-title');
    const labelEl = document.getElementById('project-label');
    const logoLink = document.getElementById('logo-link');
    const ctaGroup = document.getElementById('cta-group');
    const discoverLink = document.getElementById('discover-link');
    const watchLink = document.getElementById('watch-link');
    const muteBtn = document.getElementById('btn-mute');
    let isMuted = true;

    // Generates a .btn-cta anchor and appends it to ctaGroup
    function addSiteButton(label, url, external) {
      const a = document.createElement('a');
      a.href = url;
      a.className = 'btn-cta';
      if (external) a.target = '_blank';
      a.innerHTML = `<span>${label}</span><span class="arrow">→</span>`;
      ctaGroup.appendChild(a);
    }

    function showError() {
      loader.classList.add('hidden');
      errorState.style.display = 'flex';
    }

    function showUI(hasVideo) {
      loader.classList.add('hidden');
      if (hasVideo) {
        video.classList.add('ready');
      } else {
        imageBg.classList.add('ready');
      }
      requestAnimationFrame(() => {
        titleEl.classList.add('visible');
        logoLink.classList.add('visible');
        labelEl.classList.add('visible');
        ctaGroup.classList.add('visible');
        if (hasVideo) muteBtn.classList.add('visible');
      });
    }

    if (!project) {
      showError();
    } else {
      document.title = `${project.title} — zinco.cc`;
      titleEl.textContent = project.title;

      const hasVideo = !!project.video;

      if (hasVideo) {
        // ── Video mode ──
        discoverLink.style.display = project.link ? '' : 'none';
        if (project.link) {
          discoverLink.href = project.link;
          if (project.external) discoverLink.target = '_blank';
        }

        // Watch video button — opens video file directly in browser native player
        watchLink.href = project.video;
        watchLink.style.display = '';

        // Set video source
        const sourceEl = document.createElement('source');
        sourceEl.src = project.video;
        sourceEl.type = project.video.endsWith('.webm') ? 'video/webm' : 'video/mp4';
        video.appendChild(sourceEl);
        video.load();

        video.addEventListener('canplay', () => {
          video.play().catch(() => { });
          showUI(true);
        }, { once: true });

        // Fallback
        setTimeout(() => {
          if (!video.classList.contains('ready')) showUI(true);
        }, 3000);

        video.addEventListener('error', showError);

        // Mute toggle
        muteBtn.addEventListener('click', () => {
          isMuted = !isMuted;
          video.muted = isMuted;
          muteBtn.textContent = isMuted ? '🔇' : '🔊';
        });

      } else {
        // ── Image / no-video mode ──
        muteBtn.style.display = 'none';
        watchLink.style.display = 'none';

        // Background image
        if (project.image) {
          imageBg.style.display = 'block';
          imageBg.src = project.image;
          imageBg.onload = () => showUI(false);
          imageBg.onerror = () => showUI(false); // show UI even if image fails
        } else {
          // No image either — just show the dark background
          showUI(false);
        }

        // Single discover link (legacy `link` field)
        if (project.link) {
          discoverLink.href = project.link;
          if (project.external) discoverLink.target = '_blank';
          discoverLink.style.display = '';
        } else {
          discoverLink.style.display = 'none';
        }

        // Multi-site buttons (dynamic — any number supported)
        if (project.sites && project.sites.length > 0) {
          discoverLink.style.display = 'none'; // hide generic button when using custom ones
          project.sites.forEach(site => {
            addSiteButton(site.label || 'visita sito', site.url, !!site.external);
          });
        }
      }
    }
  </script>

</body>

</html>
