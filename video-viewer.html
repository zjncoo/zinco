<!DOCTYPE html>
<html lang="en">

<head>
  <title>Project Video — zinco.cc</title>
  <meta name="description" content="Watch the project video." />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="canonical" href="https://zinco.cc/video-viewer.html" />
  <meta name="robots" content="noindex, noai, noimageai" />
  <meta name="tdm-reservation" content="1" />
  <link rel="icon" href="imghome/favicon_zinco.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://use.typekit.net/rra4uka.css">

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --white: #ffffff;
      --black: #0a0a0a;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: var(--black);
      color: var(--white);
      font-family: 'neue-haas-unica', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 500;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Custom Cursor ── */
    .custom-cursor {
      position: fixed;
      top: -5px;
      left: -5px;
      width: 10px;
      height: 10px;
      background-color: #ffffff;
      border-radius: 50%;
      pointer-events: none;
      z-index: 99999;
      transition: transform 0.08s ease-out, width 0.2s ease, height 0.2s ease;
      mix-blend-mode: difference;
    }

    .custom-cursor.cursor-hover {
      width: 24px;
      height: 24px;
      top: -12px;
      left: -12px;
    }

    @media (pointer: coarse), (hover: none) {
      .custom-cursor {
        display: none !important;
      }
    }

    /* ── Full-screen video bg ── */
    #video-bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      opacity: 0;
      transition: opacity 1.2s ease;
    }

    #video-bg.ready {
      opacity: 1;
    }

    /* ── Full-screen image bg (for projects without video) ── */
    #image-bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      opacity: 0;
      transition: opacity 1.2s ease;
      display: none;
    }

    #image-bg.ready {
      opacity: 1;
    }

    /* ── Gradient overlay ── */
    .overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(to bottom,
          rgba(0, 0, 0, 0.6) 0%,
          rgba(0, 0, 0, 0.08) 35%,
          rgba(0, 0, 0, 0.08) 65%,
          rgba(0, 0, 0, 0.8) 100%);
      z-index: 1;
    }

    /* ── UI Layer ── */
    .ui {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(1.5rem, 4vw, 2.5rem);
      pointer-events: none;
    }

    /* Top: logo + label */
    .ui-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .logo-link {
      pointer-events: all;
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      opacity: 0;
      transform: translateY(-12px);
      transition: opacity 0.7s ease 0.4s, transform 0.7s ease 0.4s;
    }

    .logo-link.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .nav-brand-text {
      font-family: 'neue-haas-unica', sans-serif;
      font-weight: 400;
      font-size: 1.35rem;
      letter-spacing: -0.03em;
      color: #ffffff;
      text-decoration: none;
      line-height: 1;
      transition: opacity 0.2s ease;
    }

    .logo-link:hover .nav-brand-text {
      opacity: 0.7;
    }

    .project-label {
      font-family: 'neue-haas-unica', sans-serif;
      font-size: clamp(0.7rem, 2vw, 0.82rem);
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.7);
      opacity: 0;
      transform: translateY(-12px);
      transition: opacity 0.7s ease 0.6s, transform 0.7s ease 0.6s;
      text-align: right;
    }

    .project-label.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Center: big title — vertically centered */
    .ui-center {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: left;
      padding: 0 clamp(1.5rem, 4vw, 2.5rem);
    }

    #project-title {
      font-family: 'neue-haas-unica', sans-serif;
      font-size: clamp(3.2rem, 12vw, 8.5rem);
      font-weight: 500;
      letter-spacing: -0.035em;
      line-height: 0.95;
      color: var(--white);
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.9s ease 0.2s, transform 0.9s ease 0.2s;
      text-shadow: 0 2px 40px rgba(0, 0, 0, 0.45);
      text-align: left;
      width: 100%;
      text-transform: lowercase;
    }

    #project-title.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Bottom: buttons + mute */
    .ui-bottom {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .cta-group {
      display: flex;
      flex-direction: row;
      gap: 0.75rem;
      flex-wrap: wrap;
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.8s ease 0.8s, transform 0.8s ease 0.8s;
    }

    .cta-group.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Buttons — Editorial Design System */
    .btn-cta {
      pointer-events: all;
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      border: 2px solid #ffffff;
      background: #ffffff;
      color: #000000;
      padding: 0 1.6rem;
      height: 48px;
      font-family: 'neue-haas-unica', sans-serif;
      font-weight: 500;
      font-size: clamp(0.82rem, 2.2vw, 0.92rem);
      letter-spacing: -0.01em;
      text-transform: lowercase;
      text-decoration: none;
      cursor: pointer;
      box-sizing: border-box;
      transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }

    .btn-cta:hover {
      background: #000000;
      color: #ffffff;
      border-color: #ffffff;
      transform: translateY(-2px);
    }

    .custom-arrow-icon {
      display: inline-block;
      vertical-align: middle;
      width: 10px;
      height: 10px;
      transition: transform 0.2s ease;
    }

    .btn-cta:hover .custom-arrow-icon,
    .btn-dropdown-menu a:hover .custom-arrow-icon {
      transform: translate(2px, -2px);
    }

    /* ── Dropdown (overflow of CTA buttons) ── */
    .btn-dropdown {
      position: relative;
      pointer-events: all;
    }

    .btn-dropdown-trigger {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      border: 2px solid #ffffff;
      background: #ffffff;
      color: #000000;
      padding: 0 1.6rem;
      height: 48px;
      font-family: 'neue-haas-unica', sans-serif;
      font-weight: 500;
      font-size: clamp(0.82rem, 2.2vw, 0.92rem);
      letter-spacing: -0.01em;
      text-transform: lowercase;
      cursor: pointer;
      box-sizing: border-box;
      white-space: nowrap;
      transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }

    .btn-dropdown-trigger:hover {
      background: #000000;
      color: #ffffff;
      border-color: #ffffff;
      transform: translateY(-2px);
    }

    .btn-dropdown-trigger .chevron {
      display: inline-flex;
      align-items: center;
      transition: transform 0.25s ease;
    }

    .btn-dropdown.open .btn-dropdown-trigger .chevron {
      transform: rotate(180deg);
    }

    .btn-dropdown-menu {
      position: absolute;
      bottom: calc(100% + 8px);
      left: 0;
      background: #ffffff;
      border: 2px solid #000000;
      min-width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0;
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 20;
    }

    .btn-dropdown.open .btn-dropdown-menu {
      opacity: 1;
      transform: translateY(0);
      pointer-events: all;
    }

    .btn-dropdown-menu a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      padding: 0.75rem 1.25rem;
      font-family: 'neue-haas-unica', sans-serif;
      font-size: clamp(0.8rem, 2vw, 0.88rem);
      font-weight: 500;
      letter-spacing: -0.01em;
      text-transform: lowercase;
      text-decoration: none;
      color: #000000;
      border-bottom: 1px solid rgba(0, 0, 0, 0.12);
      transition: background-color 0.15s;
      white-space: nowrap;
    }

    .btn-dropdown-menu a:last-child {
      border-bottom: none;
    }

    .btn-dropdown-menu a:hover {
      background: #f4f4f4;
    }

    /* Mute button — solid square with subtle border */
    .btn-mute {
      pointer-events: all;
      background: rgba(0, 0, 0, 0.65);
      border: 2px solid rgba(255, 255, 255, 0.35);
      color: var(--white);
      width: 48px;
      height: 48px;
      border-radius: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      opacity: 0;
      transition: opacity 0.8s ease 1s, background-color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }

    .btn-mute.visible {
      opacity: 1;
    }

    .btn-mute:hover {
      background: #000000;
      border-color: #ffffff;
      transform: translateY(-2px);
    }

    /* Error state */
    #error-state {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--black);
      z-index: 10;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      text-align: center;
      padding: 2rem;
    }

    #error-state h1 {
      font-size: clamp(2rem, 8vw, 4rem);
      font-weight: 500;
      letter-spacing: -0.03em;
      text-transform: lowercase;
    }

    #error-state p {
      color: rgba(255, 255, 255, 0.6);
      font-size: 1rem;
    }

    /* Loading spinner */
    #loader {
      position: fixed;
      inset: 0;
      background: var(--black);
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.6s ease;
    }

    #loader.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-top-color: var(--white);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
  <script src="components.js" defer></script>
</head>

<body>

  <div class="custom-cursor" id="cursor"></div>

  <!-- Loader -->
  <div id="loader">
    <div class="spinner"></div>
  </div>

  <!-- Error state -->
  <div id="error-state">
    <a href="index.html" style="text-decoration:none;"><span class="nav-brand-text" style="font-size:2.2rem; color:white; display:block; margin-bottom:1.5rem;">zinco</span></a>
    <h1>project not found</h1>
    <p>the video or preview you're looking for doesn't exist or has been moved.</p>

      <svg class="custom-arrow-icon" viewBox="0 0 10 10" width="10" height="10" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><line x1="1.5" y1="8.5" x2="8.5" y2="1.5"></line><polyline points="3.5 1.5 8.5 1.5 8.5 6.5"></polyline></svg>

  <!-- Video background -->
  <video id="video-bg" autoplay muted playsinline loop preload="auto"></video>

  <!-- Dark overlay -->

  <!-- UI -->
  <div class="ui">

        </a>
        <a href="#" id="watch-link" class="btn-cta cursor-target" target="_blank" rel="noopener">
          <span>watch video</span>
          <svg class="custom-arrow-icon" viewBox="0 0 10 10" width="10" height="10" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><line x1="1.5" y1="8.5" x2="8.5" y2="1.5"></line><polyline points="3.5 1.5 8.5 1.5 8.5 6.5"></polyline></svg>
        </a>
        <!-- site buttons injected dynamically by JS -->
      </div>
      <button class="btn-mute cursor-target" id="btn-mute" title="Toggle sound" aria-label="Toggle mute"></button>
    </div>
  </div>

  <script>
    const projectsDB = {
      alua: {

          { label: "animation 3", src: "UNI YEAR 1/projects_basics_lab/img/animations/ANIMAZIONE3-GRUPPO3.mp4" },

      },
      cpp: {

        ]
      },
      escapes: {

        external: false,
        sites: [
          { label: "live website", url: "https://escapeslakecomo.com", external: true }

      },
      gizeta: {

      dranks: {

      },

      },
      femvertising: {
        title: "FemVertising",
        image: "publications/femvertising/img/femvertising_mockup_1.webp",

        external: false
      },
      "roxy-book": {

      fotografia: {

    // Project Aliases
    projectsDB.poldi_pezzoli = projectsDB.cpp;
    projectsDB.rifiuti = projectsDB.rifiuti_spaziali;
    projectsDB["3m"] = projectsDB.am;
    projectsDB.amdecor = projectsDB.am;
    projectsDB.piedibus_mozzate = projectsDB.piedibus;
    projectsDB.fioreria_del_lago = projectsDB.fdl;
    projectsDB.roxy_brandbook = projectsDB["roxy-book"];
    projectsDB.fotografie = projectsDB.fotografia;

    const ARROW_SVG = '<svg class="custom-arrow-icon" viewBox="0 0 10 10" width="10" height="10" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><line x1="1.5" y1="8.5" x2="8.5" y2="1.5"></line><polyline points="3.5 1.5 8.5 1.5 8.5 6.5"></polyline></svg>';
    const CHEVRON_SVG = '<svg class="chevron" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="2 3.5 5 6.5 8 3.5"></polyline></svg>';
    const MUTE_SVG = '<svg class="mute-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>';
    const UNMUTE_SVG = '<svg class="unmute-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>';

    const params = new URLSearchParams(window.location.search);
    const rawSlug = (params.get('project') || '').toLowerCase().trim().replace(/^\/+|\/+$/g, '');
    const project = projectsDB[rawSlug];

    const loader = document.getElementById('loader');
    const errorState = document.getElementById('error-state');
    const video = document.getElementById('video-bg');
    const imageBg = document.getElementById('image-bg');
    const titleEl = document.getElementById('project-title');
    const labelEl = document.getElementById('project-label');
    const logoLink = document.getElementById('logo-link');
    const ctaGroup = document.getElementById('cta-group');
    const discoverLink = document.getElementById('discover-link');
    const watchLink = document.getElementById('watch-link');
    const muteBtn = document.getElementById('btn-mute');
    let isMuted = true;
    if (muteBtn) muteBtn.innerHTML = MUTE_SVG;

    // Button collector — call addSiteButton() for each item,
    // then renderButtons() once. If >2 items they go into a dropdown.
    const _pendingButtons = [];

    function addSiteButton(label, url, external) {
      _pendingButtons.push({ label, url, external });
    }

    function renderButtons() {
      const items = _pendingButtons;
      if (items.length === 0) return;

      if (items.length <= 2) {
        items.forEach(({ label, url, external }) => {
          const a = document.createElement('a');
          a.href = url;
          a.className = 'btn-cta cursor-target';
          if (external) a.target = '_blank';
          a.innerHTML = `<span>${label}</span>${ARROW_SVG}`;
          ctaGroup.appendChild(a);
        });
      } else {
        // Dropdown
        const wrapper = document.createElement('div');
        wrapper.className = 'btn-dropdown';

        const trigger = document.createElement('button');
        trigger.className = 'btn-dropdown-trigger cursor-target';
        trigger.innerHTML = `<span>more links</span>${CHEVRON_SVG}`;
        trigger.addEventListener('click', e => {
          e.stopPropagation();
          wrapper.classList.toggle('open');
        });

        const menu = document.createElement('div');
        menu.className = 'btn-dropdown-menu';
        items.forEach(({ label, url, external }) => {
          const a = document.createElement('a');
          a.href = url;
          a.className = 'cursor-target';
          if (external) a.target = '_blank';
          a.innerHTML = `<span>${label}</span>${ARROW_SVG}`;
          menu.appendChild(a);
        });

        wrapper.appendChild(trigger);
        wrapper.appendChild(menu);
        ctaGroup.appendChild(wrapper);

        // Close on outside click
        document.addEventListener('click', () => wrapper.classList.remove('open'));
      }
    }

    function showError() {
      loader.classList.add('hidden');
      errorState.style.display = 'flex';
    }

    function showUI(hasVideo) {
      loader.classList.add('hidden');
      if (hasVideo) {
        video.classList.add('ready');
      } else {
        imageBg.classList.add('ready');
      }
      requestAnimationFrame(() => {
        titleEl.classList.add('visible');
        logoLink.classList.add('visible');
        labelEl.classList.add('visible');
        ctaGroup.classList.add('visible');
        if (hasVideo) muteBtn.classList.add('visible');
      });
    }

    if (!project) {
      showError();
    } else {
      document.title = `${project.title} — zinco.cc`;
      titleEl.textContent = project.title;

      const hasVideo = !!project.video;
      const hasVideos = !!(project.videos && project.videos.length > 0);

      if (hasVideos) {
        // ── Multi-video mode ──
        const firstSrc = project.videos[0].src;
        discoverLink.style.display = 'none';
        watchLink.style.display = 'none';

        if (project.link) {
          addSiteButton('discover the project', project.link, !!project.external);
        }
        project.videos.forEach(v => {
          addSiteButton('watch ' + v.label, v.src, false);
        });
        renderButtons();

        video.innerHTML = '';
        const sourceEl = document.createElement('source');
        sourceEl.src = firstSrc;
        sourceEl.type = firstSrc.endsWith('.webm') ? 'video/webm' : 'video/mp4';
        video.appendChild(sourceEl);
        video.load();

        video.addEventListener('canplay', () => {
          video.play().catch(() => { });
          showUI(true);
        }, { once: true });

        setTimeout(() => {
          if (!video.classList.contains('ready')) showUI(true);
        }, 1200);

        video.addEventListener('error', () => showUI(true));

        muteBtn.addEventListener('click', () => {
          isMuted = !isMuted;
          video.muted = isMuted;
          muteBtn.innerHTML = isMuted ? MUTE_SVG : UNMUTE_SVG;
        });

      } else if (hasVideo) {
        // ── Video mode ──
        discoverLink.style.display = project.link ? '' : 'none';
        if (project.link) {
          discoverLink.href = project.link;
          if (project.external) discoverLink.target = '_blank';
        }

        watchLink.href = project.video;
        watchLink.style.display = '';

        // Add MP4 and WebM sources for cross-device compatibility
        video.innerHTML = '';
        const sources = [];
        if (project.video.endsWith('.mp4')) {
          sources.push({ src: project.video, type: 'video/mp4' });
          sources.push({ src: project.video.replace(/\.mp4$/, '.webm'), type: 'video/webm' });
        } else if (project.video.endsWith('.webm')) {
          sources.push({ src: project.video.replace(/\.webm$/, '.mp4'), type: 'video/mp4' });
          sources.push({ src: project.video, type: 'video/webm' });
        } else {
          sources.push({ src: project.video, type: 'video/mp4' });
        }

        sources.forEach(s => {
          const sourceEl = document.createElement('source');
          sourceEl.src = s.src;
          sourceEl.type = s.type;
          video.appendChild(sourceEl);
        });
        video.load();

        video.addEventListener('canplay', () => {
          video.play().catch(() => { });
          showUI(true);
        }, { once: true });

        // Fallback: Always reveal UI within 1200ms
        setTimeout(() => {
          if (!video.classList.contains('ready')) showUI(true);
        }, 1200);

        // Never trigger 404 error state on video error
        video.addEventListener('error', () => {
          if (project.image) {
            imageBg.style.display = 'block';
            imageBg.src = project.image;
            showUI(false);
          } else {
            showUI(true);
          }
        });

        // Mute toggle
        muteBtn.addEventListener('click', () => {
          isMuted = !isMuted;
          video.muted = isMuted;
          muteBtn.innerHTML = isMuted ? MUTE_SVG : UNMUTE_SVG;
        });

        // Extra sites for this project (e.g. teaser) — go into dropdown
        if (project.sites && project.sites.length > 0) {
          project.sites.forEach(s => {
            addSiteButton(s.label || 'link', s.url, !!s.external);
          });
          if (project.forceDropdown) {
            const sentinel = { label: '__sentinel__', url: '#', external: false };
            const sentinel2 = { label: '__sentinel2__', url: '#', external: false };
            _pendingButtons.push(sentinel, sentinel2);
            renderButtons();
            ctaGroup.querySelectorAll('.btn-dropdown-menu a').forEach(a => {
              if (a.querySelector('span') && a.querySelector('span').textContent.startsWith('__sentinel')) {
                a.remove();
              }
            });
          } else {
            renderButtons();
          }
        }

      } else {
        // ── Image / no-video mode ──
        muteBtn.style.display = 'none';
        watchLink.style.display = 'none';

        // Background image
        if (project.image) {
          imageBg.style.display = 'block';
          imageBg.src = project.image;
          imageBg.onload = () => showUI(false);
          imageBg.onerror = () => showUI(false); // show UI even if image fails
        } else {
          // No image either — just show the dark background
          showUI(false);
        }

        // Single discover link (legacy `link` field)
        if (project.link) {
          discoverLink.href = project.link;
          if (project.external) discoverLink.target = '_blank';
          discoverLink.style.display = '';
        } else {
          discoverLink.style.display = 'none';
        }

        // Multi-site buttons (dynamic — any number supported)
        if (project.sites && project.sites.length > 0) {
          discoverLink.style.display = 'none'; // hide generic button when using custom ones
          project.sites.forEach(site => {
            addSiteButton(site.label || 'visita sito', site.url, !!site.external);
          });
          renderButtons();
        }
      }
    }

    // ── Custom Cursor Motion ──
    const cursor = document.getElementById('cursor');
    if (cursor && window.matchMedia('(pointer: fine)').matches) {
      let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
      let cursorX = mouseX, cursorY = mouseY;
      let cursorRAF = null;
      const speed = 0.2;
      const animateCursor = () => {
        const distX = mouseX - cursorX;
        const distY = mouseY - cursorY;
        cursorX += distX * speed;
        cursorY += distY * speed;
        cursor.style.transform = `translate3d(${cursorX}px, ${cursorY}px, 0)`;
        if (Math.abs(distX) > 0.1 || Math.abs(distY) > 0.1) {
          cursorRAF = requestAnimationFrame(animateCursor);
        } else {
          cursorRAF = null;
        }
      };
      document.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
        if (!cursorRAF) cursorRAF = requestAnimationFrame(animateCursor);
      }, { passive: true });
      document.addEventListener('mouseover', (e) => {
        if (e.target && e.target.closest && e.target.closest('a, button, .cursor-target, .btn-cta, .btn-dropdown-trigger, .btn-mute')) {
          cursor.classList.add('cursor-hover');
        }
      }, { passive: true });
      document.addEventListener('mouseout', (e) => {
        if (!e.relatedTarget || !e.relatedTarget.closest || !e.relatedTarget.closest('a, button, .cursor-target, .btn-cta, .btn-dropdown-trigger, .btn-mute')) {
          cursor.classList.remove('cursor-hover');
        }
      }, { passive: true });
    }
  </script>

</body>
