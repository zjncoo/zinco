<!DOCTYPE html>
<html lang="it">
<head>
  <title>beer | zinco</title>
  <meta name="description" content="a personal editorial project on beer culture. type-driven layout, no fluff, just design and content working together." />
  <meta property="og:title" content="Recensioni Birre" />
  <meta property="og:description" content="a personal editorial project on beer culture. type-driven layout, no fluff, just design and content working together." />
  <meta property="og:image" content="https://zinco.cc/imghome/logo_zinco.svg" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="zinco.cc" />
  <meta property="og:url" content="https://zinco.cc/beer/beer.html" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="../imghome/logo_zinco.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="../imghome/logo_zinco.svg" />
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Link al file CSS esterno -->
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts per un look minimalista -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Font per i titoli -->
    <link href="https://fonts.cdnfonts.com/css/helvetica-neue-5" rel="stylesheet">
  <link rel="stylesheet" href="https://use.typekit.net/rra4uka.css">
  <script src="../components.js" defer></script>
</head>
<body>
  <div class="site-main-content">

    <header class="site-header">
        <div class="logo-placeholder">
            <img id="logo" src="beerlogo.svg" alt="Logo del sito" loading="lazy" decoding="async">
        </div>
    </header>

    <main class="container">
        <div class="filter-section">
            <div class="country-filter">
                <label for="country-filter">Filtra per paese:</label>
                <select id="country-filter">
                    <option value="all">Tutti i paesi</option>
                    <!-- Le opzioni verranno popolate da JavaScript -->
                </select>
            </div>
            <div class="price-filter">
                <label for="price-filter">Prezzo massimo: <span id="price-value"></span></label>
                <input type="range" id="price-filter" min="0" max="10" step="0.10">
            </div>
        </div>

        <div id="beer-list" class="beer-list-container">
            <!-- Le recensioni delle birre verranno inserite qui da JavaScript -->
        </div>
    </main>

    <!-- Link al file JavaScript esterno (messo alla fine per performance) -->
    <script src="script.js"></script>
</body>
</html>
