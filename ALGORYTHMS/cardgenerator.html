<body>
  <div class="site-main-content">
  <div class="custom-cursor" id="cursor"></div>
  <a href="../index.html" id="button-logo" class="cursor-target"><img src="../imghome/logo_zinco.svg" id="logo" alt="Logo Zinco" loading="lazy" decoding="async"></a>

  <main>
    <div class="container">
      <h1>Tessere Fedeltà Personalizzate</h1>

      <div class="instructions" role="region" aria-label="Istruzioni per l'uso">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M12 2a10 10 0 1 0 10 10A10.011 10.011 0 0 0 12 2zm.75 15.5a1.25 1.25 0 1 1-1.25-1.25 1.25 1.25 0 0 1 1.25 1.25zm1.9-7.75-1.4 1.41a1.5 1.5 0 1 0-2.12 2.12l.7.7v1.17h1.25v-.55l-1.03-1.04a.75.75 0 0 1 1.06-1.06l1.4-1.41a.75.75 0 0 0-1.06-1.06z"/>
        </svg>
        <div>
          <strong>Come funziona:</strong>
          <ul>
            <li>Carica il PDF template della tessera.</li>
            <li>Carica il file CSV con le colonne <code>Nome</code> e <code>Cognome</code>.</li>
            <li>Clicca su "Genera tessere" per scaricare il file ZIP.</li>
          </ul>
        </div>
      </div>

      <label for="pdfTemplate">1. Carica PDF template</label>
      <input type="file" id="pdfTemplate" accept="application/pdf" class="cursor-target" />

      <label for="csvFile">2. Carica file CSV</label>
      <input type="file" id="csvFile" accept=".csv,text/csv" class="cursor-target" />

      <button id="generateBtn" disabled class="cursor-target">Genera tessere PDF in ZIP</button>

      <div id="status" role="status" aria-live="polite"></div>
    </div>
  </main>

    </div><!-- /site-main-content -->

  <zinco-footer base-path="../"></zinco-footer>

  <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.0/jszip.min.js"></script>
  <script src="../index.js" defer></script>
  <script>
    const pdfTemplateInput = document.getElementById('pdfTemplate');
    const csvFileInput = document.getElementById('csvFile');
    const generateBtn = document.getElementById('generateBtn');
    const status = document.getElementById('status');

    let pdfTemplateBytes = null;
    let csvData = null;

    function readFileAsync(file, asText = false) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error);
        if (asText) {
          reader.readAsText(file);
        } else {
          reader.readAsArrayBuffer(file);
        }
      });
    }

    function parseCSV(text) {
      const lines = text.trim().split('\n');
      const headers = lines[0].split(',').map(h => h.trim());
      const rows = lines.slice(1).map(line => {
        const values = line.split(',').map(v => v.trim());
        let obj = {};
        headers.forEach((h, i) => { obj[h] = values[i]; });
        return obj;
      });
      return rows;
    }

    function checkReady() {
      generateBtn.disabled = !(pdfTemplateBytes && csvData);
    }

    pdfTemplateInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      pdfTemplateBytes = await readFileAsync(file);
      status.textContent = `Template PDF caricato: ${file.name}`;
      checkReady();
    });

    csvFileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const text = await readFileAsync(file, true);
      try {
        csvData = parseCSV(text);
        if (!csvData[0].hasOwnProperty('Nome') || !csvData[0].hasOwnProperty('Cognome')) {
          status.textContent = 'Errore: il CSV deve contenere le colonne "Nome" e "Cognome"';
          csvData = null;
        } else {
          status.textContent = `CSV caricato: ${file.name}, ${csvData.length} righe`;
        }
      } catch (err) {
        status.textContent = 'Errore nel parsing del CSV';
        csvData = null;
      }
      checkReady();
    });

    function mmToPt(mm) {
      return mm * 2.83465;
    }

    generateBtn.addEventListener('click', async () => {
      status.textContent = 'Sto generando i PDF e preparando lo ZIP...';
      generateBtn.disabled = true;

      const { PDFDocument, rgb, StandardFonts } = PDFLib;

      try {
        const pdfDocTemplate = await PDFDocument.load(pdfTemplateBytes);
        const zip = new JSZip();
        const x = mmToPt(4.5);
        const yNome_mm = 39.55;
        const yCognome_mm = 43.673;
        const fontSize = 12;

        for (let i = 0; i < csvData.length; i++) {
          const { Nome, Cognome } = csvData[i];
          const pdfDoc = await PDFDocument.create();
          const [templatePage] = await pdfDoc.copyPages(pdfDocTemplate, [0]);
          pdfDoc.addPage(templatePage);
          const page = pdfDoc.getPage(0);
          const pageHeight = page.getHeight();
          const yNome = pageHeight - mmToPt(yNome_mm);
          const yCognome = pageHeight - mmToPt(yCognome_mm);
          const embeddedFont = await pdfDoc.embedFont(StandardFonts.HelveticaBold);

          function wrapText(text, maxWidth, font, fontSize) {
            const words = text.split(' ');
            const lines = [];
            let currentLine = words[0];
            for (let i = 1; i < words.length; i++) {
              const word = words[i];
              const width = font.widthOfTextAtSize(currentLine + ' ' + word, fontSize);
              if (width <= maxWidth) {
                currentLine += ' ' + word;
              } else {
                lines.push(currentLine);
                currentLine = word;
              }
            }
            lines.push(currentLine);
            return lines;
          }

          const maxTextWidth = mmToPt(49.5);
          const nomeLines = wrapText(Nome, maxTextWidth, embeddedFont, fontSize);
          const cognomeLines = wrapText(Cognome, maxTextWidth, embeddedFont, fontSize);
          const nomeBlockOffset = nomeLines.length > 1 ? 7 : 0;
          const yNomeAdjusted = yNome + nomeBlockOffset;

          nomeLines.forEach((line, index) => {
            page.drawText(line, { x, y: yNomeAdjusted - index * (fontSize + 1), size: fontSize, font: embeddedFont, color: rgb(0, 0, 0) });
          });

          const nomeBlockHeight = nomeLines.length * (fontSize + 1);
          const extraSpacing = nomeLines.length > 1 ? 4 : 0;
          const yCognomeAdjusted = yNomeAdjusted - nomeBlockHeight - extraSpacing;

          cognomeLines.forEach((line, index) => {
            page.drawText(line, { x, y: yCognomeAdjusted - index * (fontSize + 1), size: fontSize, font: embeddedFont, color: rgb(0, 0, 0) });
          });

          const pdfBytes = await pdfDoc.save();
          const safeNome = Nome.replace(/\s+/g, '_').replace(/[^\w\-]/g, '');
          const safeCognome = Cognome.replace(/\s+/g, '_').replace(/[^\w\-]/g, '');
          zip.file(`Tessera_${safeNome}_${safeCognome}.pdf`, pdfBytes);
          status.textContent = `Preparata tessera ${i + 1} / ${csvData.length}`;
        }

        status.textContent = 'Compressione ZIP in corso... attendere.';
        const zipBlob = await zip.generateAsync({ type: "blob" });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(zipBlob);
        link.download = 'Tessere_Fedelta.zip';
        document.body.appendChild(link);
        link.click();
        link.remove();
        status.textContent = `Generazione completata! ZIP creato con ${csvData.length} tessere.`;

      } catch (error) {
        console.error(error);
        status.textContent = `Errore: ${error.message}`;
      }
      generateBtn.disabled = false;
    });
  </script>
</body>
