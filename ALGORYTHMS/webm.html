<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Convertitore WebM (Isolato)</title>
  
  <link rel="icon" href="../imghome/logo_zinco.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body{font-family: 'Inter', sans-serif; display:flex; flex-direction:column; min-height:100vh; margin:0; background-color:#fff;}
    main{padding: 40px 20px; display:flex; justify-content:center; align-items:center; width:100%; flex-grow:1;}
    .container{max-width:700px; width:100%; border:2px solid #000; padding:40px; text-align:center;}
    h1{font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight:700; font-size:clamp(2rem, 8vw, 3rem); margin:0 0 20px; letter-spacing:-.02em;}
    #upload-area{cursor: pointer; border:2px dashed #000; padding:60px 30px; transition:background-color .2s ease,border-color .2s ease; margin-top:40px;}
    #upload-area.dragover{background-color:#f0f0f0;}
    #upload-area p strong{text-decoration:underline;}
    #video-preview-container{margin-top:20px; text-align:center;}
    video{max-width:100%; border:2px solid #000; background-color:#f0f0f0;}
    .action-button{margin-top:20px; width:100%; font-size:1rem; padding:14px 0; background-color:#000; color:#fff; border:2px solid #000; font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; font-weight:700; text-transform:uppercase; cursor:pointer; transition:background-color .2s ease,color .2s ease;}
    .action-button:hover{background-color:#fff; color:#000;}
    #download-link{display:none;}
    #status{margin-top:20px; min-height:1.3em; font-size:14px;}
    #progress-bar{width:100%;height:8px;margin-top:15px;display:none;-webkit-appearance:none;appearance:none;border:2px solid #000}#progress-bar::-webkit-progress-bar{background-color:#fff}#progress-bar::-webkit-progress-value{background-color:#000}#progress-bar::-moz-progress-bar{background-color:#000}
  </style>
</head>
<body>

  <main>
    <div class="container">
      <h1>WebM Converter</h1>
      <p>Converti i tuoi file video (es. MP4, MOV) in formato WebM per il web.</p>

      <label for="video-input" id="upload-area">
        <input type="file" id="video-input" accept="video/*" style="display:none">
        <p>Trascina un video qui o <strong>clicca per sfogliare</strong></p>
      </label>

      <div id="video-preview-container"></div>
      <div id="status">Seleziona un file per iniziare</div>
      <progress id="progress-bar" value="0" max="100"></progress>
      
      <a href="#" id="download-link" class="action-button" target="_blank">Download WebM</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const { FFmpeg } = FFmpeg;
      const { fetchFile, toBlobURL } = FFmpegUtil;

      const uploadArea = document.getElementById('upload-area'); 
      const videoInput = document.getElementById('video-input');
      const status = document.getElementById('status');
      const progressBar = document.getElementById('progress-bar');
      const downloadLink = document.getElementById('download-link');
      const previewContainer = document.getElementById('video-preview-container');

      let ffmpeg;
      let isEngineLoaded = false;

      const loadFFmpeg = async () => {
        try {
          status.textContent = 'Caricamento del motore di conversione...';
          ffmpeg = new FFmpeg();
          // === MODIFICA QUI: Ho attivato la riga seguente per il debug ===
          ffmpeg.on('log', ({ message }) => { console.log(message); });
          
          ffmpeg.on('progress', ({ ratio }) => {
            if (ratio >= 0 && ratio <= 1) {
              const progressValue = ratio * 100;
              progressBar.style.display = 'block';
              progressBar.value = progressValue;
              status.textContent = `Conversione in corso... ${Math.round(progressValue)}%`;
            }
          });
          
          const baseURL = 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/umd';
          await ffmpeg.load({
              coreURL: await toBlobURL(`${baseURL}/ffmpeg-core.js`, 'text/javascript'),
              wasmURL: await toBlobURL(`${baseURL}/ffmpeg-core.wasm`, 'application/wasm'),
          });
          
          isEngineLoaded = true;
          status.textContent = 'Motore pronto. Seleziona un file.';
        } catch (error) {
            console.error("Errore durante il caricamento di FFmpeg:", error);
            status.textContent = 'Errore nel caricamento del motore di conversione.';
        }
      };

      loadFFmpeg();
      
      videoInput.addEventListener('change', (e) => handleFile(e.target.files[0]));
      uploadArea.addEventListener('dragover', (e) => { e.preventDefault(); uploadArea.classList.add('dragover'); });
      uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
      uploadArea.addEventListener('drop', (e) => { e.preventDefault(); uploadArea.classList.remove('dragover'); handleFile(e.dataTransfer.files[0]); });

      const handleFile = async (file) => {
        if (!isEngineLoaded) {
            status.textContent = "Attendi il caricamento del motore prima di selezionare un file.";
            return;
        }
        if (!file) return;
        if (!file.type.startsWith('video/')) {
          status.textContent = 'Per favore, seleziona un file video.'; return;
        }
        previewContainer.innerHTML = '';
        const videoElement = document.createElement('video');
        videoElement.src = URL.createObjectURL(file);
        videoElement.controls = true;
        videoElement.muted = true;
        previewContainer.appendChild(videoElement);
        downloadLink.style.display = 'none';
        progressBar.style.display = 'none';
        progressBar.value = 0;
        const convertButton = document.createElement('button');
        convertButton.textContent = 'Converti in WebM';
        convertButton.className = 'action-button';
        previewContainer.appendChild(convertButton);
        status.textContent = `File caricato: ${file.name}. Clicca per convertire.`;
        convertButton.addEventListener('click', async () => {
          convertButton.style.display = 'none';
          await convertToWebM(file);
        });
      };

      const convertToWebM = async (file) => {
        try {
          status.textContent = 'Preparazione del file...';
          const fileData = await fetchFile(file);
          const inputFileName = 'input.' + file.name.split('.').pop();
          const outputFileName = 'output.webm';
          await ffmpeg.writeFile(inputFileName, fileData);
          status.textContent = 'Avvio conversione... (potrebbe richiedere tempo)';

          await ffmpeg.run('-i', inputFileName, '-c:v', 'libvpx-vp9', '-crf', '30', '-b:v', '0', '-c:a', 'libopus', outputFileName);
          
          const data = await ffmpeg.readFile(outputFileName);
          const webmBlob = new Blob([data], { type: 'video/webm' });
          const webmUrl = URL.createObjectURL(webmBlob);
          downloadLink.href = webmUrl;
          downloadLink.download = file.name.replace(/\.[^/.]+$/, "") + ".webm";
          downloadLink.style.display = 'inline-block';
          status.textContent = 'Conversione completata!';
          progressBar.style.display = 'none';
          
          await ffmpeg.deleteFile(inputFileName);
          await ffmpeg.deleteFile(outputFileName);

        } catch (error) {
          console.error(error);
          status.textContent = 'Si è verificato un errore durante la conversione.';
          progressBar.style.display = 'none';
        }
      };
    });
  </script>
</body>
</html>
