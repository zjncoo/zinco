<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertitore Video in WebM</title>
    <!-- Tailwind CSS per lo stile -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Inter per un look moderno -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Stile per la barra di avanzamento */
        .progress-bar-inner {
            transition: width 0.3s ease-in-out;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white rounded-xl shadow-lg p-6 sm:p-8 w-full max-w-lg mx-4">
        
        <!-- Intestazione -->
        <div class="text-center mb-6">
            <h1 class="text-2xl sm:text-3xl font-bold text-gray-800">Convertitore Video in WebM</h1>
            <p class="text-gray-500 mt-2">Converti i tuoi file video in formato WebM direttamente nel browser.</p>
        </div>

        <!-- Area di Input -->
        <div id="input-area">
            <label for="video-upload" class="block w-full cursor-pointer border-2 border-dashed border-gray-300 rounded-lg p-8 text-center hover:border-blue-500 hover:bg-gray-50 transition-colors">
                <svg class="mx-auto h-12 w-12 text-gray-400" stroke="currentColor" fill="none" viewBox="0 0 48 48" aria-hidden="true">
                    <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <span id="file-name" class="mt-2 block text-sm font-medium text-gray-600">Seleziona un file video</span>
                <span class="mt-1 block text-xs text-gray-500">MP4, MOV, AVI, ecc.</span>
            </label>
            <input id="video-upload" type="file" class="hidden" accept="video/*">
            <button id="convert-btn" class="mt-6 w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50 transition-transform transform hover:scale-105 disabled:bg-gray-400 disabled:cursor-not-allowed disabled:transform-none" disabled>
                Converti in WebM
            </button>
        </div>

        <!-- Area di Progresso -->
        <div id="progress-area" class="hidden text-center">
            <p id="progress-text" class="text-gray-700 font-medium mb-2">Conversione in corso...</p>
            <div class="w-full bg-gray-200 rounded-full h-4 overflow-hidden">
                <div id="progress-bar" class="bg-blue-600 h-4 rounded-full progress-bar-inner" style="width: 0%"></div>
            </div>
            <p id="progress-ratio" class="text-sm text-gray-500 mt-1">0%</p>
        </div>

        <!-- Area di Output -->
        <div id="output-area" class="hidden text-center">
            <h2 class="text-xl font-semibold text-green-600 mb-4">Conversione Completata!</h2>
            <video id="video-preview" class="w-full rounded-lg shadow-md mb-4" controls></video>
            <a id="download-btn" href="#" download="video_convertito.webm" class="w-full block bg-green-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-opacity-50 transition-transform transform hover:scale-105">
                Scarica il video WebM
            </a>
            <button id="convert-another-btn" class="mt-4 w-full bg-gray-500 text-white font-bold py-2 px-4 rounded-lg hover:bg-gray-600 transition-colors">
                Converti un altro video
            </button>
        </div>

    </div>
    
    <!-- Libreria FFmpeg.wasm (versione aggiornata) -->
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.6/dist/ffmpeg.min.js"></script>
    <script>
        // Funzione per inizializzare il convertitore
        const initializeConverter = () => {
            // Elementi del DOM
            const videoUpload = document.getElementById('video-upload');
            const fileNameSpan = document.getElementById('file-name');
            const convertBtn = document.getElementById('convert-btn');
            const inputArea = document.getElementById('input-area');
            const progressArea = document.getElementById('progress-area');
            const progressText = document.getElementById('progress-text');
            const progressBar = document.getElementById('progress-bar');
            const progressRatio = document.getElementById('progress-ratio');
            const outputArea = document.getElementById('output-area');
            const videoPreview = document.getElementById('video-preview');
            const downloadBtn = document.getElementById('download-btn');
            const convertAnotherBtn = document.getElementById('convert-another-btn');

            // Variabile per memorizzare il file selezionato
            let selectedFile = null;

            // Controlla se la libreria FFmpeg è stata caricata
            if (typeof FFmpeg === 'undefined') {
                console.error('La libreria FFmpeg non è stata caricata.');
                document.querySelector('.container').innerHTML = '<p class="text-red-500 text-center">Errore: Impossibile caricare la libreria di conversione. Ricarica la pagina.</p>';
                return;
            }

            // Inizializzazione di FFmpeg
            const { createFFmpeg, fetchFile } = FFmpeg;
            const ffmpeg = createFFmpeg({
                log: true, // Abilita i log nella console per il debug
                corePath: 'https://unpkg.com/@ffmpeg/core@0.12.4/dist/ffmpeg-core.js',
            });

            // Gestione della selezione del file
            videoUpload.addEventListener('change', (event) => {
                selectedFile = event.target.files[0];
                if (selectedFile) {
                    fileNameSpan.textContent = selectedFile.name;
                    convertBtn.disabled = false;
                } else {
                    fileNameSpan.textContent = 'Seleziona un file video';
                    convertBtn.disabled = true;
                }
            });

            // Gestione del click sul pulsante di conversione
            convertBtn.addEventListener('click', async () => {
                if (!selectedFile) return;

                inputArea.classList.add('hidden');
                progressArea.classList.remove('hidden');
                convertBtn.disabled = true;
                
                try {
                    if (!ffmpeg.isLoaded()) {
                        progressText.textContent = 'Caricamento della libreria...';
                        await ffmpeg.load();
                    }

                    progressText.textContent = 'Preparazione del file...';
                    ffmpeg.FS('writeFile', selectedFile.name, await fetchFile(selectedFile));

                    ffmpeg.setProgress(({ ratio }) => {
                        const percentage = Math.round(ratio * 100);
                        if (percentage < 0) return;
                        progressBar.style.width = `${percentage}%`;
                        progressRatio.textContent = `${percentage}%`;
                    });

                    progressText.textContent = 'Conversione in corso... (potrebbe richiedere tempo)';
                    await ffmpeg.run('-i', selectedFile.name, '-c:v', 'libvpx-vp9', '-b:v', '1M', '-c:a', 'libopus', 'output.webm');
                    
                    progressText.textContent = 'Finalizzazione...';
                    const data = ffmpeg.FS('readFile', 'output.webm');
                    const videoUrl = URL.createObjectURL(new Blob([data.buffer], { type: 'video/webm' }));

                    videoPreview.src = videoUrl;
                    downloadBtn.href = videoUrl;
                    progressArea.classList.add('hidden');
                    outputArea.classList.remove('hidden');

                } catch (error) {
                    console.error(error);
                    progressText.textContent = 'Si è verificato un errore durante la conversione.';
                    setTimeout(resetUI, 3000);
                }
            });

            // Gestione del pulsante "Converti un altro"
            convertAnotherBtn.addEventListener('click', resetUI);

            function resetUI() {
                selectedFile = null;
                videoUpload.value = '';
                fileNameSpan.textContent = 'Seleziona un file video';
                convertBtn.disabled = true;
                outputArea.classList.add('hidden');
                inputArea.classList.remove('hidden');
                progressBar.style.width = '0%';
                progressRatio.textContent = '0%';
                if (videoPreview.src) {
                    URL.revokeObjectURL(videoPreview.src);
                }
            }
        };

        // Esegue lo script di inizializzazione solo dopo che la pagina è completamente caricata
        window.addEventListener('load', initializeConverter);
    </script>
</body>
</html>
