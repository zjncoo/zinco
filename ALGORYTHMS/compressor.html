<!DOCTYPE html>
<html lang="it">

<head>
  <title>Video Compressor - zinco</title>

  <meta property="og:image" content="https://zinco.cc/imghome/logo_zinco.svg" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="zinco.cc" />
  <meta property="og:url" content="https://zinco.cc/ALGORYTHMS/compressor.html" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="apple-touch-icon" href="../imghome/logo_zinco.svg" />
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    

    <!-- Service Worker per abilitare SharedArrayBuffer (richiesto da FFmpeg.wasm) -->

    <!-- Stili Globali del Sito -->
    <link rel="stylesheet" href="../index.css" />
    

    <!-- Dipendenze Esterne (Lenis, Font, FFmpeg) -->
    <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.27/bundled/lenis.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>

    <!-- Script del Sito -->
    <script src="../projects-data.js" defer></script>

    <style>
        /* Stili Specifici per il Convertitore (in sostituzione di Tailwind) */
        .converter-container {
            width: 100%;
            max-width: 600px;
            margin: 40px auto;
            border: 2px solid black;
            padding: 40px;
            text-align: center;
        }

        .upload-area {
            border: 2px dashed black;
            padding: 40px 20px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-bottom: 20px;
            display: block;
            /* label behaves like block */
        }

        .upload-area:hover {
            background-color: #f0f0f0;
        }

        .upload-icon {
            width: 50px;
            height: 50px;
            margin-bottom: 10px;
            stroke: black;
            /* Icona nera */
        }

        .hidden {
            display: none !important;
        }

        .progress-container {
            width: 100%;
            border: 2px solid black;
            height: 30px;
            margin: 20px 0;
            position: relative;
        }

        .progress-fill {
            background-color: #FFD600;
            /* Giallo Zinco */
            height: 100%;
            width: 0%;
            transition: width 0.2s linear;
        }

        .video-preview {
            width: 100%;
            border: 2px solid black;
            margin-bottom: 20px;
        }

        /* Utility helper per spaziature */
        .mb-2 {
            margin-bottom: 20px;
        }

        .text-small {
            font-size: 0.9rem;
            color: #666;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background-color: #ccc;
            border-color: #ccc;
            color: #666;
        }

        button:disabled:hover {
            background-color: #ccc;
            color: #666;
        }

        .format-select {
            width: 100%;
            padding: 10px;
            border: 2px solid black;
            font-family: inherit;
            font-size: 1rem;
            margin-bottom: 5px;
            background-color: white;
            cursor: pointer;
        }
    </style>
  <link rel="stylesheet" href="https://use.typekit.net/rra4uka.css">
  <script src="../components.js" defer></script>
</head>

<body>
    <div class="site-main-content">

        <!-- Scroll Progress Bar -->
        <div id="scroll-progress-bar"></div>

        <!-- Preloader -->
        <div id="preloader">
            <a href="../index.html" id="logo"><img src="../imghome/logo_zinco.svg" alt="Zinco Logo"></a>
            <div class="loader-bar-container">
                <div class="loader-bar"></div>
            </div>
        </div>

        <!-- Custom Cursor -->
        <div class="custom-cursor" id="cursor"></div>

        <!-- Navigazione Fissa -->
        <!-- Menu a Tendina -->
        <zinco-header base-path="../"></zinco-header>

    <main>
            <div class="shapes"></div> <!-- Spaziatore Shapes dall'header -->

            <p class="intro">
                Video Compressor<br>
                <span style="font-size: 1rem; opacity: 0.6;">Make your video files lighter directly in the browser without losing quality.</span>
            </p>

            <div class="converter-container">

                <!-- Area di Input -->
                <div id="input-area">
                    <label for="video-upload" class="upload-area">
                        <svg class="upload-icon mx-auto" xmlns="http://www.w3.org/2000/svg" fill="none"
                            viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                        </svg>
                        <span id="file-name" class="block" style="font-weight: bold;">Select video files</span>
                        <span class="text-small">MP4, MOV, AVI, etc. (multiple allowed)</span>
                    </label>
                    <input id="video-upload" type="file" class="hidden" accept="video/*" multiple>

                    <div style="text-align: left; margin-bottom: 20px;">
                        <label style="font-weight: bold; margin-bottom: 10px; display: block;">Select Output Format</label>
                        <select id="format-select" class="format-select">
                            <option value="mp4" selected>MP4 (H.264)</option>
                            <option value="webm">WebM (VP9)</option>
                            <option value="gif">GIF (Animated Image)</option>
                        </select>
                        <p id="format-description" class="text-small">Best compatibility across all devices. Great for general use and social media sharing.</p>
                    </div>

                    <button id="convert-btn" class="btn btn--solid-dark" style="width: 100%;" disabled>
                        Compress Videos
                    </button>
                </div>

                <!-- Area di Progresso -->
                <div id="progress-area" class="hidden">
                    <p id="progress-text" style="font-weight: bold; margin-bottom: 10px;">Compression in progress...</p>
                    <div class="progress-container">
                        <div id="progress-bar" class="progress-fill"></div>
                    </div>
                    <p id="progress-ratio" class="text-small">0%</p>
                </div>

                <!-- Area di Output -->
                <div id="output-area" class="hidden">
                    <h2 style="color: black; margin-bottom: 20px;">Compression Complete!</h2>
                    
                    <div id="downloads-list" style="margin-bottom: 20px; text-align: left;">
                        <!-- I pulsanti di download verranno inseriti qui -->
                    </div>

                    <button id="convert-another-btn" class="btn btn--outline-dark" style="width: 100%;">
                        Compress other videos
                    </button>
                </div>

            </div>

        </main>

    </div><!-- /site-main-content -->

    <zinco-footer base-path="../"></zinco-footer>

    <!-- Script Principale del Sito -->
    <script src="../index.js"></script>

    <!-- Logica del Convertitore -->
    <script>
        const initializeConverter = () => {
            const videoUpload = document.getElementById('video-upload');
            const fileNameSpan = document.getElementById('file-name');
            const formatSelect = document.getElementById('format-select');
            const formatDescription = document.getElementById('format-description');
            const convertBtn = document.getElementById('convert-btn');
            const inputArea = document.getElementById('input-area');
            const progressArea = document.getElementById('progress-area');
            const progressText = document.getElementById('progress-text');
            const progressBar = document.getElementById('progress-bar');
            const progressRatio = document.getElementById('progress-ratio');
            const outputArea = document.getElementById('output-area');
            const downloadsList = document.getElementById('downloads-list');
            const convertAnotherBtn = document.getElementById('convert-another-btn');

            let selectedFiles = [];
            let generatedUrls = [];

            const formatDescriptions = {
                'mp4': 'Best compatibility across all devices. Great for general use and social media sharing.',
                'webm': 'Optimized for web performance. Smaller file sizes, great for modern browsers and websites.',
                'gif': 'Looping animated image without sound. Best for short clips or reactions, but creates larger file sizes.'
            };

            formatSelect.addEventListener('change', (e) => {
                formatDescription.textContent = formatDescriptions[e.target.value] || '';
            });

            if (typeof FFmpeg === 'undefined') {
                console.error('FFmpeg library was not loaded.');
                alert('Error: Cannot load conversion library.');
                return;
            }

            const { createFFmpeg, fetchFile } = FFmpeg;

            videoUpload.addEventListener('change', (event) => {
                selectedFiles = Array.from(event.target.files);
                if (selectedFiles.length > 0) {
                    if (selectedFiles.length === 1) {
                        fileNameSpan.textContent = selectedFiles[0].name;
                    } else {
                        fileNameSpan.textContent = `${selectedFiles.length} files selected`;
                    }
                    convertBtn.disabled = false;
                } else {
                    fileNameSpan.textContent = 'Select video files';
                    convertBtn.disabled = true;
                }
            });

            convertBtn.addEventListener('click', async () => {
                if (selectedFiles.length === 0) return;

                if (typeof SharedArrayBuffer === 'undefined') {
                    alert('Warning: Your browser does not support SharedArrayBuffer on this page. To use the video compressor, you must view the site via an HTTPS server (or localhost) and not from a local file (file:///).');
                    return;
                }

                const selectedFormat = formatSelect.value;
                inputArea.classList.add('hidden');
                progressArea.classList.remove('hidden');
                convertBtn.disabled = true;

                try {
                    for (let i = 0; i < selectedFiles.length; i++) {
                        const file = selectedFiles[i];
                        const safeName = `input_${i}_${file.name.replace(/[^a-zA-Z0-9.]/g, '_')}`;
                        const outputExt = selectedFormat === 'gif' ? 'gif' : selectedFormat === 'webm' ? 'webm' : 'mp4';
                        const outputName = `output_${i}.${outputExt}`;

                        // Reinizializziamo ffmpeg per OGNI file per evitare memory leak e crash del browser
                        progressText.textContent = `Caricamento motore... (file ${i + 1} di ${selectedFiles.length})`;
                        const ffmpeg = createFFmpeg({
                            log: true,
                            corePath: 'https://unpkg.com/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js',
                        });
                        await ffmpeg.load();

                        progressText.textContent = `Preparing file ${i + 1} of ${selectedFiles.length}...`;
                        ffmpeg.FS('writeFile', safeName, await fetchFile(file));

                        ffmpeg.setProgress(({ ratio }) => {
                            const percentage = Math.round(ratio * 100);
                            if (percentage < 0 || percentage > 100) return;
                            progressBar.style.width = `${percentage}%`;
                            progressRatio.textContent = `${percentage}%`;
                        });

                        progressText.textContent = `Compressing ${i + 1}/${selectedFiles.length}: ${file.name}...`;
                        
                        let command = [];
                        if (selectedFormat === 'mp4') {
                            command = ['-i', safeName, '-vcodec', 'libx264', '-crf', '28', '-preset', 'ultrafast', '-movflags', '+faststart', outputName];
                        } else if (selectedFormat === 'webm') {
                            command = ['-i', safeName, '-c:v', 'libvpx-vp9', '-b:v', '1M', '-c:a', 'libopus', outputName];
                        } else if (selectedFormat === 'gif') {
                            command = ['-i', safeName, '-vf', 'fps=10,scale=320:-1:flags=lanczos', '-c:v', 'gif', outputName];
                        }
                        
                        await ffmpeg.run(...command);

                        progressText.textContent = `Finalizing ${i + 1}/${selectedFiles.length}...`;
                        const data = ffmpeg.FS('readFile', outputName);
                        
                        let mimeType = 'video/mp4';
                        if (selectedFormat === 'webm') mimeType = 'video/webm';
                        if (selectedFormat === 'gif') mimeType = 'image/gif';
                        
                        const fileUrl = URL.createObjectURL(new Blob([data.buffer], { type: mimeType }));
                        
                        generatedUrls.push({ name: file.name, url: fileUrl, ext: outputExt });

                        // Terminare ffmpeg de-alloca forzatamente tutta la RAM di WebAssembly
                        try {
                            ffmpeg.exit();
                        } catch (e) {
                            console.warn('Could not exit ffmpeg clean:', e);
                        }
                    }

                    // Render output links
                    downloadsList.innerHTML = '';
                    generatedUrls.forEach((item, index) => {
                        const link = document.createElement('a');
                        link.href = item.url;
                        const originalNameWithoutExt = item.name.substring(0, item.name.lastIndexOf('.')) || item.name;
                        link.download = `${originalNameWithoutExt}_compressed.${item.ext}`;
                        link.className = 'btn btn--solid-dark';
                        link.style.display = 'block';
                        link.style.marginBottom = '10px';
                        link.textContent = `Download: ${link.download}`;
                        downloadsList.appendChild(link);
                    });

                    progressArea.classList.add('hidden');
                    outputArea.classList.remove('hidden');

                } catch (error) {
                    console.error(error);
                    progressText.textContent = 'Error during compression.';
                    alert('An error occurred during compression. Forse il video è troppo grande per la memoria del browser.');
                    setTimeout(resetUI, 1000);
                }
            });

            convertAnotherBtn.addEventListener('click', resetUI);

            function resetUI() {
                selectedFiles = [];
                generatedUrls.forEach(item => URL.revokeObjectURL(item.url));
                generatedUrls = [];
                videoUpload.value = '';
                fileNameSpan.textContent = 'Select video files';
                convertBtn.disabled = true;
                downloadsList.innerHTML = '';
                
                outputArea.classList.add('hidden');
                inputArea.classList.remove('hidden');
                progressArea.classList.add('hidden');
                progressBar.style.width = '0%';
                progressRatio.textContent = '0%';
            }
        };

        window.addEventListener('load', initializeConverter);
    </script>
</body>

</html>
