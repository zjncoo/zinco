<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HomePage - zinco</title>
  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="../zinco/imghome/logo_zinco.svg">
  <!-- Linking external CSS files -->
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="https://use.typekit.net/npp3dgf.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet"> <!-- Adding Inter font -->
</head>

<body>

  <!-- Loading Screen -->
  <div id="loading-screen">
    <div id="logo-container">
      <!-- Logo Image -->
      <img src="imghome/logo_zinco.svg" alt="Logo" id="logoanimation">
      <!-- Percentage text to show loading progress -->
      <div id="percentage">0%</div>
    </div>
    <!-- Fixed Button -->
    <button class="fixed-button">@zjncoo</button>
  </div>

  <script>
    // Script to handle loading screen progress
    document.addEventListener("DOMContentLoaded", function() {
      let percentage = 0;
      const loadingScreen = document.getElementById('loading-screen');
      const percentageDisplay = document.getElementById('percentage');
      const mainContent = document.getElementById('main-content');
      
      // Simulating loading process
      const loadingInterval = setInterval(() => {
        if (percentage < 100) {
          percentage++;
          percentageDisplay.textContent = `${percentage}%`;
        } else {
          clearInterval(loadingInterval);

          // Delay transition of loading screen by 1 second
          setTimeout(() => {
            loadingScreen.style.transition = 'transform 0.5s ease-out';
            loadingScreen.style.transform = 'translateY(-100%)';
            mainContent.classList.remove('hidden');
          }, 1000); // 1000ms delay
        }
      }, 15); // Update the percentage every 15ms
    });
  </script>

  <!-- Landing Section -->
  <section class="landing">
    <div class="content">
      <!-- Landing page logo -->
      <img src="imghome/logo_zinco.svg" id="logo">
    </div>
    
    <!-- Spline Viewer (3D Model Viewer) -->
    <script type="module" src="https://unpkg.com/@splinetool/viewer@1.9.63/build/spline-viewer.js"></script>
    <spline-viewer id="coso" loading-anim-type="spinner-small-dark" url="https://prod.spline.design/pzAGOuhTojAnubm0/scene.splinecode"></spline-viewer>
    
    <!-- Overlay element covering the section -->
    <div id="covering"></div>
  </section>

  <!-- Scroll Button to Discover My Work Section -->
  <a href="#projects"><button class="scroll-btn">Discover My Work</button></a>

  <!-- Hidden Section with Buttons for Projects -->
  <section class="links" id="projects">
    <h2>My Projects</h2>
    <h3>Branding</h3>

    <!-- Project Grid with Branding Projects -->
    <div class="project-grid">
      <!-- Section for Branding Projects (2x2 Grid) -->
      <div class="project-section">
        <div class="project-subgrid">
          <!-- Project 1: ROXYGEN -->
          <a href="ROXY/roxy.html" class="project-button" style="background-image: url('imghome/roxy.png');">
            <h3>ROXYGEN</h3>
          </a>
          <!-- Project 2: ESCAPES -->
          <a href="../LEZIONE-1IA/index.html" class="project-button" style="background-image: url('imghome/escapes.png');">
            <h3>ESCAPES</h3>
          </a>
          <!-- Project 3: AM DECOR -->
          <a href="AM_DECOR/amdecor.html" class="project-button" style="background-image: url('imghome/am.png');">
            <h3>AM DECOR</h3>
          </a>
          <!-- Project 4: GRAPHIC 1 (Placeholder) -->
          <a href="#" class="project-button" style="background-image: url('path-to-image');">
            <h3>GRAPHIC 1</h3>
          </a>
        </div>
      </div>

      <!-- Section for Websites & Graphics Projects (2x2 Grid) -->
      <div class="project-section">
        <div class="project-subgrid">
          <!-- Project 1: Lezione 3 -->
          <a href="https://lcg-infodesign.github.io/lcg2425-01-zjncoo/" class="project-button" style="background-image: url('imghome/squares.png');">
            <h3>RANDOM 1</h3>
          </a>
          <!-- Project 2: Assignment 1 -->
          <a href="https://lcg-infodesign.github.io/lcg2425-02-zjncoo/" class="project-button" style="background-image: url('imghome/linee.png');">
            <h3>GLYPHS</h3>
          </a>
          <!-- Project 3: Assignment 2 -->
          <a href="https://lcg-infodesign.github.io/lcg2425-03-zjncoo/" class="project-button" style="background-image: url('imghome/spirali.png');">
            <h3>RIVERS</h3>
          </a>
          <!-- Project 4: GRAPHIC 2 (Placeholder) -->
          <a href="#" class="project-button" style="background-image: url('path-to-image');">
            <h3>GRAPHIC 2</h3>
          </a>
        </div>
      </div>
    </div> <!-- End of project-grid -->
  </section>

  <!-- Transition Cover (used for page transitions) -->
  <div id="transition-cover">
    <img src="imghome/logo_zinco.svg" alt="Logo">
  </div>

  <script>
    // Script to handle transition animation when clicking external links
    const transitionCover = document.getElementById('transition-cover');
    const externalLinks = document.querySelectorAll('.project-button');

    externalLinks.forEach(link => {
      link.addEventListener('click', (event) => {
        event.preventDefault(); // Prevent default link behavior
        document.body.classList.add('locked'); // Lock the page for animation
        
        // Trigger transition cover animation
        transitionCover.classList.add('active');

        // Wait for animation to finish before navigating
        setTimeout(() => {
          window.location.href = link.href; // Navigate to the external link
        }, 1000); // Duration of the animation
      });
    });

    // Event listener for when a new page is loaded
    window.addEventListener('load', () => {
      // Hide the transition cover after loading
      transitionCover.classList.remove('active');
      transitionCover.classList.add('inactive');

      // Unlock the page after the animation
      setTimeout(() => {
        document.body.classList.remove('locked');
      }, 500); // Delay to match the animation time
    });
  </script>

  <!-- Footer Section -->
  <footer id="footer">
    <div class="footer-content">

      <!-- Contact info -->
      <div class="footer-contact">
        <p>Hi, I'm a Communication Design student! This website is a repository / portfolio of my work.</p>
        <p>&copy; 2025 Francesco Zanchetta | Communication Designer</p>
      </div>
    </div>
  </footer>
