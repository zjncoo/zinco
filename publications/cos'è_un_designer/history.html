  <script>
    // Il tuo codice Javascript rimane invariato
    document.addEventListener('DOMContentLoaded', () => {
      const pdfUrl = 'img/potter.pdf';
      const { pdfjsLib } = window;
      pdfjsLib.GlobalWorkerOptions.workerSrc = `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js`;

      const canvasLeft = document.getElementById('canvas-left');
      const ctxLeft = canvasLeft.getContext('2d');
      const canvasRight = document.getElementById('canvas-right');
      const ctxRight = canvasRight.getContext('2d');
      const pageIndicator = document.getElementById('page-indicator');
      const prevBtn = document.getElementById('prev-page');
      const nextBtn = document.getElementById('next-page');

      let pdfDoc = null;
      let currentPage = 0;
      let totalPages = 0;
      
      const loadPdfFromUrl = async (url) => {
        try {
          pdfDoc = await pdfjsLib.getDocument(url).promise;
          totalPages = pdfDoc.numPages;
          renderSpread(1);
        } catch (error) {
          console.error('Errore durante il caricamento del PDF:', error);
          pageIndicator.textContent = 'Errore nel caricamento del PDF.';
        }
      };
      
      prevBtn.addEventListener('click', goPrev);
      nextBtn.addEventListener('click', goNext);
      updateNavButtons();
      loadPdfFromUrl(pdfUrl);

      function renderPage(canvas, ctx, pageNum) {
        return new Promise(async (resolve) => {
          if (!pdfDoc || pageNum <= 0 || pageNum > totalPages) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            canvas.classList.add('hidden');
            resolve();
            return;
          }
          
          canvas.classList.remove('hidden');
          const page = await pdfDoc.getPage(pageNum);
          
          const pixelRatio = window.devicePixelRatio || 1;
          const viewport = page.getViewport({ scale: 1 });
          const scale = (canvas.clientHeight * pixelRatio) / viewport.height;
          const scaledViewport = page.getViewport({ scale: scale });

          canvas.height = scaledViewport.height;
          canvas.width = scaledViewport.width;
          
          const renderContext = {
            canvasContext: ctx,
            viewport: scaledViewport
          };
          await page.render(renderContext).promise;
          resolve();
        });
      }

      function renderSpread(num) {
        currentPage = num;
        const isMobile = window.innerWidth <= 767;
        if (isMobile) {
          renderPage(canvasLeft, ctxLeft, currentPage);
          pageIndicator.textContent = `Pagina ${currentPage} / ${totalPages}`;
        } else {
          if (currentPage === 1) {
            renderPage(canvasLeft, ctxLeft, 0);
            renderPage(canvasRight, ctxRight, 1);
            pageIndicator.textContent = `Pagina 1 / ${totalPages}`;
          } else {
            renderPage(canvasLeft, ctxLeft, currentPage);
            renderPage(canvasRight, ctxRight, currentPage + 1);
            if (currentPage + 1 <= totalPages) {
              pageIndicator.textContent = `Pagine ${currentPage}-${currentPage + 1} / ${totalPages}`;
            } else {
              pageIndicator.textContent = `Pagina ${currentPage} / ${totalPages}`;
            }
          }
        }
        updateNavButtons();
      }

      function updateNavButtons() {
        const isMobile = window.innerWidth <= 767;
        let increment = isMobile ? 1 : 2;
        if (!isMobile && currentPage === 1) increment = 1;
        prevBtn.disabled = currentPage <= 1;
        nextBtn.disabled = (currentPage + increment - 1) >= totalPages;
      }

      function goNext() {
        if (currentPage >= totalPages && !(currentPage === 1 && totalPages === 1)) return;
        const isMobile = window.innerWidth <= 767;
        let nextPage = currentPage;
        if (currentPage === 0) nextPage = 1;
        else if (currentPage === 1 && !isMobile) nextPage = 2;
        else nextPage = currentPage + (isMobile ? 1 : 2);
        renderSpread(nextPage);
      }

      function goPrev() {
        if (currentPage <= 1) return;
        const isMobile = window.innerWidth <= 767;
        let prevPage = currentPage;
        if (currentPage === 2 && !isMobile) prevPage = 1;
        else prevPage = currentPage - (isMobile ? 1 : 2);
        renderSpread(prevPage);
      }
    });
  </script>
