<script src="../projects-data.js?v=21"></script>
<script>
  // Enforce PDF viewer before branding grid
  (function() {
    function enforceOrder() {
      var bg = document.getElementById('brandingGrid');
      var pdf = document.getElementById('pdfViewerContainer');
      if (bg && pdf && bg.parentNode) {
        bg.parentNode.insertBefore(pdf, bg);
      }
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', enforceOrder);
    } else {
      enforceOrder();
    }
    window.addEventListener('load', enforceOrder);
    setTimeout(enforceOrder, 500);
    setTimeout(enforceOrder, 2000);
    setTimeout(enforceOrder, 5000);
  })();
</script>
