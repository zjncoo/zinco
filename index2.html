<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Illo Style Page</title>
  <link rel="stylesheet" href="index2.css" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="custom-cursor" id="cursor"></div>

  
  <a href="#" id="button-logo"><img src="imghome/logo_zinco.svg"  id="logo" alt=""></a>
  <!-- Bottoni angolari -->
  <a href="#" class="corner-button cursor-target" id="btnTopRight">more</a>
  <a href="#" class="corner-button cursor-target" id="btnBottomLeft">studio</a>
  <a href="#" class="corner-button cursor-target" id="btnBottomRight">contact</a>

  

  <main>
    <div class="shapes"></div>
    <p class="intro">
      I am a <span class="underline">communication design student</span>, 
      <span class="colorful">Colourful</span> 
    </p>
  </main>

  <section class="projects-section">
    <h2>Branding</h2>
    <div class="project-grid">
      <img src="branding1.jpg" alt="Branding Project 1" class="cursor-target" />
      <img src="branding2.jpg" alt="Branding Project 2" class="cursor-target" />
      <img src="branding3.jpg" alt="Branding Project 3" class="cursor-target" />
    </div>
  
    <h2>p5</h2>
    <div class="project-grid">
      <img src="p5_1.jpg" alt="p5 Project 1" class="cursor-target" />
      <img src="p5_2.jpg" alt="p5 Project 2" class="cursor-target" />
      <img src="p5_3.jpg" alt="p5 Project 3" class="cursor-target" />
    </div>
  
    <h2>Websites</h2>
    <div class="project-grid">
      <img src="web1.jpg" alt="Website Project 1" class="cursor-target"/>
      <img src="web2.jpg" alt="Website Project 2" class="cursor-target"/>
      <img src="web3.jpg" alt="Website Project 3" class="cursor-target"/>
    </div>
  </section>

  <footer>
    <div class="cookie-banner" id="cookieBanner">
      <span>my website uses <a href="#" class="cookie-link">cookies</a></span>
      <span class="close-btn" id="closeCookie">✕</span>
    </div>
  </footer>

  <script src="index2.js"></script>
</body>
</html>
